<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TAM Group Restaurant</title>
  <meta name="description" content="TAM Group Restaurant – Coming Soon. Mowana Park Mall, Phakalane, Botswana." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --white:   #ffffff;
      --off:     #f7f4f0;
      --cream:   #ede8e1;
      --gold:    #b89a5a;
      --gold-lt: #d4b87a;
      --dark:    #1a1612;
      --mid:     #5c5248;
      --radius:  4px;
    }

    html, body {
      height: 100%;
      font-family: 'Jost', sans-serif;
      background: var(--white);
      color: var(--dark);
      -webkit-font-smoothing: antialiased;
    }

    /* ── noise texture overlay ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }

    /* ── thin gold top bar ── */
    .top-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--gold), var(--gold-lt), var(--gold));
      z-index: 100;
    }

    /* ── page layout ── */
    .page {
      position: relative;
      z-index: 1;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 24px 50px;
      text-align: center;
      gap: 0;
      overflow: hidden;
    }

    /* ── logo block ── */
    .logo-wrap {
      margin-bottom: 28px;
      opacity: 0;
      animation: fadeUp 0.9s cubic-bezier(0.22,1,0.36,1) 0.1s forwards;
    }

    .logo-placeholder {
      width: 110px;
      height: 110px;
      margin: 0 auto;
      border: 2px dashed var(--cream);
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.6rem;
      letter-spacing: 0.15em;
      color: var(--cream);
      text-transform: uppercase;
    }

    /* ── divider ── */
    .divider {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 0 auto 28px;
      width: min(320px, 80vw);
      opacity: 0;
      animation: fadeUp 0.9s cubic-bezier(0.22,1,0.36,1) 0.3s forwards;
    }

    .divider-line {
      flex: 1;
      height: 1px;
      background: var(--cream);
    }

    .divider-diamond {
      width: 6px;
      height: 6px;
      background: var(--gold);
      transform: rotate(45deg);
      flex-shrink: 0;
    }

    /* ── main headline ── */
    .headline-block {
      opacity: 0;
      animation: fadeUp 0.9s cubic-bezier(0.22,1,0.36,1) 0.45s forwards;
      margin-bottom: 28px;
    }

    .headline {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 600;
      font-size: clamp(1.8rem, 4.5vw, 3rem);
      line-height: 1.1;
      color: var(--dark);
      letter-spacing: 0.02em;
    }

    .headline em {
      font-style: italic;
      color: var(--gold);
    }

    .subline {
      font-family: 'Jost', sans-serif;
      font-weight: 500;
      font-size: clamp(1rem, 2.5vw, 1.3rem);
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--dark);
      margin-top: 16px;
    }

    /* ── progress bar ── */
    .progress-wrap {
      width: min(360px, 80vw);
      margin: 0 auto 52px;
      opacity: 0;
      animation: fadeUp 0.9s cubic-bezier(0.22,1,0.36,1) 0.6s forwards;
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--mid);
      margin-bottom: 8px;
    }

    .progress-track {
      height: 2px;
      background: var(--cream);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, var(--gold), var(--gold-lt));
      border-radius: 2px;
      animation: fillBar 2s cubic-bezier(0.22,1,0.36,1) 1s forwards;
    }

    @keyframes fillBar { to { width: 40%; } }

    /* ── location card ── */
    .location-card {
      background: var(--off);
      border: 1px solid var(--cream);
      border-radius: var(--radius);
      padding: 24px 32px;
      width: min(420px, 92vw);
      margin-top: 20px;
      opacity: 0;
      animation: fadeUp 0.9s cubic-bezier(0.22,1,0.36,1) 0.75s forwards;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .location-icon {
      margin-bottom: 10px;
    }

    .location-main {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.4rem, 4.5vw, 2.1rem);
      font-weight: 600;
      color: var(--dark);
      letter-spacing: 0.08em;
      text-align: center;
      width: 100%;
    }

    .location-country {
      font-family: 'Jost', sans-serif;
      font-size: clamp(1.1rem, 3.5vw, 1.6rem);
      letter-spacing: 0.3em;
      color: #1a5fb4;
      margin-top: 8px;
      font-weight: 600;
      text-align: center;
    }

    /* ── footer ── */
    footer {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      padding: 14px 24px;
      text-align: center;
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--cream);
      background: transparent;
    }

    footer span { color: var(--gold); }

    /* ── animations ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(22px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── mobile tweaks ── */
    @media (max-width: 480px) {
      .location-card { padding: 22px 24px; }
      .page { padding: 80px 16px 80px; }
    }
  </style>
</head>
<body>

  <div class="top-bar"></div>

  <div class="page">

    <!-- LOGO -->
    <div class="logo-wrap">
      <div class="logo-placeholder">YOUR LOGO HERE</div>
    </div>

    <!-- DIVIDER -->
    <div class="divider">
      <div class="divider-line"></div>
      <div class="divider-diamond"></div>
      <div class="divider-line"></div>
    </div>

    <!-- HEADLINE -->
    <div class="headline-block">
      <div class="headline">Something <em>exceptional</em><br>is being prepared.</div>
      <div class="subline">Website Under Construction</div>
    </div>

    <!-- LOCATION -->
    <div class="location-card">
      <div class="location-icon">
        <svg width="22" height="28" viewBox="0 0 22 28" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M11 0C4.925 0 0 4.925 0 11c0 8.25 11 17 11 17s11-8.75 11-17C22 4.925 17.075 0 11 0Zm0 15a4 4 0 1 1 0-8 4 4 0 0 1 0 8Z" fill="#b89a5a"/>
        </svg>
      </div>
      <div class="location-main">MOWANA PARK MALL, PHAKALANE</div>
      <div class="location-country">BOTSWANA</div>
    </div>

  </div>

  <footer>© 2025 tamgroup-restaurant.co.bw</footer>

</body>
</html>
